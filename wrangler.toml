# Cloudflare Workers 配置
# 这是一个静态站点：构建产物 dist/ 作为 Worker 的静态资源发布。
# main 入口只额外处理一件事——接收匿名的功能使用计数（见 worker/index.ts）。
# 页面头部规则由 dist/_headers 提供（Workers 会解析该文件）。
name = "resumake"
compatibility_date = "2026-10-16"
main = "worker/index.ts"
# 关闭 workers.dev 子域，只通过自定义域 resumake.online 提供服务，
# 避免 *.workers.dev 被搜索引擎当成第二个站点。
workers_dev = false

[assets]
directory = "./dist"
# 声明绑定后，Worker 可以把未命中的请求回落到静态资源处理
binding = "ASSETS"
# 未匹配到文件时返回 dist/404.html（而不是空白响应）
not_found_handling = "404-page"

# AI 优化的限流（按 IP，每分钟 12 次）。
# 简历通常有 15–20 条要点，6 次/分钟不够用。
# 本地开发没有这个绑定，worker/ai.ts 会自动退回到进程内计数。
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 12, period = 60 }
