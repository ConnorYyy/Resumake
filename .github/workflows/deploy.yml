name: Deploy to Cloudflare Workers

on:
  push:
    branches: [feature]
    # 每日用量快照与本地文档不参与部署，避免无意义的重复构建
    paths-ignore:
      - 'data/**'
      - 'docs/**'
  workflow_dispatch:

# 同一分支的连续推送只保留最后一次部署
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # 前端可见的配置（DSN / 赞助链接本身就会出现在产物里，用 variable 即可）
          # 在仓库 Settings → Secrets and variables → Actions → Variables 里配置
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_BMC_URL: ${{ vars.VITE_BMC_URL }}
          # 只在构建期用于上传 source map，不进入前端产物
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 站点更新后主动通知 Bing / Yandex / Seznam 来抓，不等它们自己排期。
      # 只需要根目录的 <key>.txt，不依赖任何 secret；失败不影响部署结果。
      - name: Notify IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
