name: Usage snapshot

# 把 Cloudflare 的页面浏览与事件计数按天存进仓库，
# 避免边缘统计过了留存期后历史趋势丢失。
on:
  schedule:
    # 每天 01:20 UTC（北京 09:20）
    - cron: '20 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/snapshot-usage.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usage-daily.csv
          if git diff --quiet --cached; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update usage snapshot"
          git push
