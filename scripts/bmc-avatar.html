<!doctype html>
<!--
  Buy Me a Coffee 头像（512×512）源文件。
  BMC 会把头像裁成圆形，所以 Logo 需要留出内边距，避免圆角被切掉。
  重新生成：用浏览器打开本文件，视口设为 512×512、设备像素比 1，截图保存为 PNG。
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Resumake BMC avatar</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 512px;
        height: 512px;
        overflow: hidden;
        background: #ffffff;
      }

      .stage {
        width: 512px;
        height: 512px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 380/512 ≈ 74%，圆形裁切后四周仍留白 */
      svg {
        width: 380px;
        height: 380px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <defs>
          <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3a3a3a" />
            <stop offset="0.55" stop-color="#161616" />
            <stop offset="1" stop-color="#000000" />
          </linearGradient>
          <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="1" stop-color="#d4d4d8" />
          </linearGradient>
          <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.6" />
          </filter>
        </defs>
        <rect width="64" height="64" rx="14" fill="url(#base)" />
        <rect x="1" y="1" width="62" height="31" rx="13" fill="url(#sheen)" />
        <rect
          x="0.75"
          y="0.75"
          width="62.5"
          height="62.5"
          rx="13.25"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.12"
          stroke-width="1.5"
        />
        <path
          d="M22 47V17h11.5a8.5 8.5 0 0 1 0 17H22m12 0 9.5 13"
          fill="none"
          stroke="#000000"
          stroke-opacity="0.5"
          stroke-width="5.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          transform="translate(0 2)"
        />
        <path
          d="M22 47V17h11.5a8.5 8.5 0 0 1 0 17H22m12 0 9.5 13"
          fill="none"
          stroke="url(#letter)"
          stroke-width="5.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#lift)"
        />
      </svg>
    </div>
  </body>
</html>
